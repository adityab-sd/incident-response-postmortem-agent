<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .header { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .node-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .node-sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #475569; }
      .edge-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="580" rx="12"/>
  <text class="header" x="40" y="38">6. Deployment Diagram — Local Dev vs. Production Reference Architecture</text>
  <text class="sub" x="40" y="60">Local SQLite + Mock Adapters setup vs. Production Container, Queue, PostgreSQL, and Secrets Manager</text>
  <line x1="275" y1="190" x2="275" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="275" y="202" text-anchor="middle">In-Process</text>
  <line x1="275" y1="325" x2="275" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="275" y="337" text-anchor="middle">SQLite WAL</text>
  <line x1="835" y1="190" x2="835" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="835" y="202" text-anchor="middle">Async Dispatch</text>
  <line x1="835" y1="325" x2="835" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="835" y="337" text-anchor="middle">TLS Read-Only</text>
  <rect x="55" y="95" width="440" height="95" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text class="node-title" x="275" y="136" text-anchor="middle">Local Dev: Simulator &amp; Pytest</text>
  <text class="node-sub" x="275" y="156" text-anchor="middle">scripts/simulate_incident.py + Uvicorn FastAPI</text>
  <rect x="55" y="230" width="440" height="95" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text class="node-title" x="275" y="271" text-anchor="middle">Local Dev: 5-Scenario Mock Adapters</text>
  <text class="node-sub" x="275" y="291" text-anchor="middle">MockLogAdapter, MockMetricsAdapter, MockChangeAdapter</text>
  <rect x="55" y="365" width="440" height="95" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text class="node-title" x="275" y="406" text-anchor="middle">Local Dev: SQLite Persistence</text>
  <text class="node-sub" x="275" y="426" text-anchor="middle">SQLiteIncidentStore (./data/incidents.db or :memory:)</text>
  <rect x="605" y="95" width="460" height="95" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text class="node-title" x="835" y="136" text-anchor="middle">Prod: API Gateway &amp; Container Pods</text>
  <text class="node-sub" x="835" y="156" text-anchor="middle">TLS Webhook Ingress + Kubernetes Worker Deployment</text>
  <rect x="605" y="230" width="460" height="95" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text class="node-title" x="835" y="271" text-anchor="middle">Prod: Secrets Manager &amp; Task Queue</text>
  <text class="node-sub" x="835" y="291" text-anchor="middle">KMS/Secrets Manager + Redis/Cloud Tasks Worker Queue</text>
  <rect x="605" y="365" width="460" height="95" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text class="node-title" x="835" y="406" text-anchor="middle">Prod: Managed PostgreSQL &amp; Live Telemetry</text>
  <text class="node-sub" x="835" y="426" text-anchor="middle">PostgresIncidentStore + Read-Only Loki/Prometheus/ArgoCD</text>
</svg>
