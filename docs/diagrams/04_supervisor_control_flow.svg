<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .header { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .node-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .node-sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #475569; }
      .edge-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="560" rx="12"/>
  <text class="header" x="40" y="38">4. Supervisor Control-Flow Diagram — Confidence Loop &amp; 3-Round Cap</text>
  <text class="sub" x="40" y="60">LangGraph routing rules, budget checks, and conditional edges in src/incident_agent/supervisor/graph.py</text>
  <line x1="320" y1="145" x2="390" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="355" y="137" text-anchor="middle">Checkpoint</text>
  <line x1="700" y1="145" x2="770" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="735" y="137" text-anchor="middle">Evidence Pool</text>
  <line x1="915" y1="190" x2="545" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="730" y="219" text-anchor="middle">Evaluate</text>
  <line x1="460" y1="265" x2="460" y2="190" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text class="edge-label" x="460" y="219" text-anchor="middle">conf &lt; 0.70 &amp; round &lt; 3</text>
  <line x1="700" y1="312" x2="770" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="735" y="304" text-anchor="middle">conf &gt;= 0.70 or round == 3</text>
  <rect x="60" y="100" width="260" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text class="node-title" x="190" y="139" text-anchor="middle">START -&gt; Node: intake</text>
  <text class="node-sub" x="190" y="159" text-anchor="middle">Normalize alert &amp; checkpoint &#x27;intake&#x27;</text>
  <rect x="390" y="100" width="310" height="90" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text class="node-title" x="545" y="139" text-anchor="middle">Node: investigate (Round 1..3)</text>
  <text class="node-sub" x="545" y="159" text-anchor="middle">Parallel fan-out of 5 discovery sub-agents</text>
  <rect x="770" y="100" width="290" height="90" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text class="node-title" x="915" y="139" text-anchor="middle">Node: rank_hypotheses</text>
  <text class="node-sub" x="915" y="159" text-anchor="middle">Rank hypotheses &amp; verify evidence citations</text>
  <rect x="390" y="265" width="310" height="95" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text class="node-title" x="545" y="306" text-anchor="middle">Decision: Confidence &amp; Budget Check</text>
  <text class="node-sub" x="545" y="326" text-anchor="middle">conf &gt;= 0.70 OR round &gt;= 3 OR budget_halted?</text>
  <rect x="770" y="265" width="290" height="95" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text class="node-title" x="915" y="306" text-anchor="middle">Node: propose_remediation -&gt; END</text>
  <text class="node-sub" x="915" y="326" text-anchor="middle">Generate PROPOSAL_ONLY steps &amp; post Slack summary</text>
</svg>
