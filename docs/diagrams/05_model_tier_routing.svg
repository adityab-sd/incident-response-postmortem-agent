  <rect class="bg" x="0" y="0" width="1120" height="560" rx="12"/>
  <text class="header" x="40" y="38">5. Model Tier &amp; Provider Fallback Diagram</text>
  <text class="sub" x="40" y="60">Role-based model assignment (supervisor, core, long_context) and automatic retry/failover chains</text>
  <line x1="315" y1="137" x2="415" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="365" y="129" text-anchor="middle">Default</text>
  <line x1="315" y1="267" x2="415" y2="267" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
