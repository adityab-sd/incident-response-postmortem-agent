  <text class="node-title" x="935" y="131" text-anchor="middle">Supervisor Secondary Fallback</text>
  <text class="node-sub" x="935" y="151" text-anchor="middle">Gemini gemini-3.5-flash-lite (1M ctx)</text>
  <rect x="795" y="225" width="280" height="85" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text class="node-title" x="935" y="261" text-anchor="middle">Core Secondary Fallback</text>
  <text class="node-sub" x="935" y="281" text-anchor="middle">Gemini gemini-3.8-flash (1M ctx)</text>
