  <line x1="315" y1="380" x2="415" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="365" y="324" text-anchor="middle">&lt;= 24k tok</text>
  <line x1="315" y1="405" x2="415" y2="397" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="365" y="393" text-anchor="middle">&gt; 24k tok</text>
  <line x1="705" y1="137" x2="795" y2="137" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text class="edge-label" x="750" y="129" text-anchor="middle">429/5xx Failover</text>
  <line x1="705" y1="267" x2="795" y2="267" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text class="edge-label" x="750" y="259" text-anchor="middle">429/5xx Failover</text>
  <line x1="705" y1="397" x2="795" y2="397" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text class="edge-label" x="750" y="389" text-anchor="middle">429/5xx Failover</text>
  <rect x="45" y="95" width="270" height="85" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
