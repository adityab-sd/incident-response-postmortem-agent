<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .header { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .node-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .node-sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #475569; }
      .edge-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="560" rx="12"/>
  <text class="header" x="40" y="38">1. System Context Diagram — Incident Response &amp; Root Cause Post-Mortem Agent</text>
  <text class="sub" x="40" y="60">External triggers, observability backends, deploy feeds, and dual-provider LLM tiers</text>
  <line x1="280" y1="127" x2="390" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="335" y="165" text-anchor="middle">Webhook</text>
  <line x1="280" y1="247" x2="390" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="335" y="240" text-anchor="middle">Events &amp; Approvals</text>
  <line x1="280" y1="367" x2="390" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="335" y="315" text-anchor="middle">Alert JSON</text>
  <line x1="700" y1="220" x2="820" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="760" y="172" text-anchor="middle">Read-Only</text>
  <line x1="700" y1="255" x2="820" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge-label" x="760" y="259" text-anchor="middle">Primary Tier</text>
  <line x1="700" y1="290" x2="820" y2="410" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text class="edge-label" x="760" y="342" text-anchor="middle">Fallback &amp; Long-Ctx</text>
  <rect x="40" y="90" width="240" height="75" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text class="node-title" x="160" y="121" text-anchor="middle">PagerDuty Webhooks</text>
  <text class="node-sub" x="160" y="141" text-anchor="middle">trigger / ack / resolve</text>
  <rect x="40" y="210" width="240" height="75" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text class="node-title" x="160" y="241" text-anchor="middle">Slack Workspace</text>
  <text class="node-sub" x="160" y="261" text-anchor="middle">/triage, mentions, Approve buttons</text>
  <rect x="40" y="330" width="240" height="75" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text class="node-title" x="160" y="361" text-anchor="middle">Alertmanager</text>
  <text class="node-sub" x="160" y="381" text-anchor="middle">Prometheus firing alerts</text>
  <rect x="390" y="175" width="310" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text class="node-title" x="545" y="244" text-anchor="middle">Incident Response &amp; Post-Mortem Pod</text>
  <text class="node-sub" x="545" y="264" text-anchor="middle">FastAPI + LangGraph Supervisor + Safety Layer</text>
  <rect x="820" y="85" width="260" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text class="node-title" x="950" y="134" text-anchor="middle">Observability &amp; Infra Backends</text>
  <text class="node-sub" x="950" y="154" text-anchor="middle">Logs, Metrics, Deploys, Topology, Runbooks</text>
  <rect x="820" y="235" width="260" height="95" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text class="node-title" x="950" y="276" text-anchor="middle">Groq Cloud (Primary LLM)</text>
  <text class="node-sub" x="950" y="296" text-anchor="middle">llama-3.1-8b-instant / llama-3.3-70b</text>
  <rect x="820" y="365" width="260" height="95" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text class="node-title" x="950" y="406" text-anchor="middle">Google Gemini API (Secondary / 1M)</text>
  <text class="node-sub" x="950" y="426" text-anchor="middle">gemini-3.5-flash-lite / gemini-3.8-flash</text>
